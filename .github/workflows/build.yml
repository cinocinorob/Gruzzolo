name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild the web assets and check they are committed
        run: |
          node web/build.mjs
          git diff --exit-code -- app/src/main/assets/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build the debug APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: gruzzolo-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # A direct .apk link for testing on a phone (no zip to extract):
      # https://github.com/<owner>/<repo>/releases/download/test/gruzzolo-test.apk
      - name: Publish the test APK as a direct download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk gruzzolo-test.apk
          gh release delete test --cleanup-tag --yes || true
          sleep 5
          gh release create test gruzzolo-test.apk --prerelease --target "$GITHUB_SHA" \
            --title "APK di prova" \
            --notes "Build di prova, firmata con una chiave temporanea. Non è la versione pubblicata su F-Droid."
