name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild the web assets and check they are committed
        run: |
          node web/build.mjs
          git diff --exit-code -- app/src/main/assets/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build the debug APK
        run: gradle --no-daemon assembleDebug

      # The same task F-Droid runs on its build server (the result is unsigned).
      - name: Build the release APK
        run: gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: gruzzolo-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # A direct .apk link for testing on a phone (no zip to extract):
      # https://github.com/<owner>/<repo>/releases/download/test/gruzzolo-test.apk
      - name: Publish the test APK as a direct download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Publish the minified release build (the code F-Droid ships), signed with a
          # throwaway key so it can be installed for testing.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1 || true)"
          [ -n "$APKSIGNER" ] || { echo "::error::apksigner not found under '$SDK'"; exit 1; }
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          [ -f "$UNSIGNED" ] || { echo "::error::missing $UNSIGNED: $(ls app/build/outputs/apk/release | tr '\n' ' ')"; exit 1; }
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -storepass android -keypass android \
            -alias test -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Gruzzolo test build" \
            || { echo "::error::keytool failed"; exit 1; }
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/test.jks" --ks-pass pass:android \
            --ks-key-alias test --key-pass pass:android \
            --out gruzzolo-test.apk "$UNSIGNED" || { echo "::error::apksigner sign failed ($APKSIGNER)"; exit 1; }
          "$APKSIGNER" verify gruzzolo-test.apk || { echo "::error::apksigner verify failed"; exit 1; }
          gh release delete test --cleanup-tag --yes || true
          sleep 5
          gh release create test gruzzolo-test.apk --prerelease --target "$GITHUB_SHA" \
            --title "APK di prova" \
            --notes "Build di prova, firmata con una chiave temporanea. Non è la versione pubblicata su F-Droid."
