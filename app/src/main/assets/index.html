<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gruzzolo</title>
<style>
:root{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
@font-face{font-family:"Nunito";font-style:normal;font-weight:200 1000;font-display:swap;src:url(fonts/nunito-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Nunito";font-style:normal;font-weight:200 1000;font-display:swap;src:url(fonts/nunito-latin-ext-wght-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
/* Layout: translucent "glass" surfaces floating over a soft coloured backdrop. Large title, one calm column, floating tab bar. */
:root{
  --bg:#EEF3F0; --card:#FFFFFF; --card2:#E6ECE7; --ink:#12161A; --ink2:#525C61; --line:#D5DDD7;
  --glass:rgb(255 255 255 / .62); --glass2:rgb(255 255 255 / .36); --glass-hi:rgb(255 255 255 / .86); --glass-brd:rgb(255 255 255 / .75);
  --blob1:#A9EFCB; --blob2:#C5DBFF; --blob3:#FFDCC8; --blob4:#FFF1B8;
  --green:#0B9A5C; --green2:#0AA58B; --on-green:#FFFFFF; --green-soft:#D3F3E1; --green-ink:#086339;
  --coral:#E4532F; --coral-soft:#FFE0D6; --coral-ink:#A93517;
  --sun:#E3A21A; --sun-soft:#FFEFC4; --sun-ink:#735000;
  --sky:#2F7FF2; --sky-soft:#D9E8FF; --sky-ink:#1450B4;
  --hero1:#0B9460; --hero2:#07706A; --hero3:#0B5A86; --on-hero:#F5FFF9; --on-hero2:#D2F2E2;
  --m1:#FFD25E; --m2:#F4B63C; --m3:#F2603F; --m-ink:#3B2A08;
  --stk:#FFFFFF; --stk-bz:#FFD9BD; --stk-ag:#DCE6F2; --stk-au:#FFE58A; --star-bz:#C97A3C; --star-ag:#8794A1; --star-au:#E3A91A; --star-off:#CDD5CF;
  --rib-c:#12A163; --rib-s:#2F7FF2; --rib-e:#E4532F; --rib-f:#8A5CF0;
  --scrim:rgb(10 20 16 / .38); --shadow:rgb(20 40 30 / .12);
  --f:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#090B0D; --card:#191C1F; --card2:#262A2E; --ink:#F3F5F4; --ink2:#A2AAAE; --line:#30353A;
    --glass:rgb(38 43 48 / .58); --glass2:rgb(38 43 48 / .34); --glass-hi:rgb(26 29 33 / .88); --glass-brd:rgb(255 255 255 / .12);
    --blob1:#0F4A35; --blob2:#16264F; --blob3:#4A2318; --blob4:#3D3410;
    --green:#3DDC91; --green2:#2CCFC0; --on-green:#04261A; --green-soft:#123423; --green-ink:#83EDB9;
    --coral:#FF7A5C; --coral-soft:#3F1E15; --coral-ink:#FFAB96;
    --sun:#F7C552; --sun-soft:#3E3111; --sun-ink:#F9CE6A;
    --sky:#6AA8FF; --sky-soft:#142B50; --sky-ink:#A6CAFF;
    --hero1:#0D7A52; --hero2:#0A5A58; --hero3:#103F66; --on-hero:#EFFFF6; --on-hero2:#B4E3CD;
    --stk:#F4F6F5; --star-off:#3A4046;
    --scrim:rgb(0 0 0 / .6); --shadow:rgb(0 0 0 / .5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#090B0D; --card:#191C1F; --card2:#262A2E; --ink:#F3F5F4; --ink2:#A2AAAE; --line:#30353A;
  --glass:rgb(38 43 48 / .58); --glass2:rgb(38 43 48 / .34); --glass-hi:rgb(26 29 33 / .88); --glass-brd:rgb(255 255 255 / .12);
  --blob1:#0F4A35; --blob2:#16264F; --blob3:#4A2318; --blob4:#3D3410;
  --green:#3DDC91; --green2:#2CCFC0; --on-green:#04261A; --green-soft:#123423; --green-ink:#83EDB9;
  --coral:#FF7A5C; --coral-soft:#3F1E15; --coral-ink:#FFAB96;
  --sun:#F7C552; --sun-soft:#3E3111; --sun-ink:#F9CE6A;
  --sky:#6AA8FF; --sky-soft:#142B50; --sky-ink:#A6CAFF;
  --hero1:#0D7A52; --hero2:#0A5A58; --hero3:#103F66; --on-hero:#EFFFF6; --on-hero2:#B4E3CD;
  --stk:#F4F6F5; --star-off:#3A4046;
  --scrim:rgb(0 0 0 / .6); --shadow:rgb(0 0 0 / .5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:500 16px/1.45 var(--f);-webkit-text-size-adjust:100%}
/* coloured backdrop the glass sits on */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(60% 42% at 8% 4%,var(--blob1),transparent 70%),
  radial-gradient(55% 40% at 100% 18%,var(--blob2),transparent 72%),
  radial-gradient(60% 40% at 0% 72%,var(--blob4),transparent 70%),
  radial-gradient(60% 44% at 100% 96%,var(--blob3),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.v{color:var(--ink2)}
.t-xl{font:800 34px/1.1 var(--f);letter-spacing:-.01em;text-wrap:balance}
.t-l{font:800 26px/1.15 var(--f);letter-spacing:-.01em}
.t-m{font:800 18px/1.25 var(--f)}
.t-s{font:700 15px/1.3 var(--f)}
.b-s{font:500 14px/1.4 var(--f)}
.b-xs{font:600 12.5px/1.35 var(--f)}
.big{font:800 46px/1 var(--f);letter-spacing:-.02em}
.sr{position:absolute;width:1px;height:1px;opacity:0;margin:0;pointer-events:none}
.ic{flex-shrink:0;display:block}

.st{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .14s cubic-bezier(.2,.8,.2,1),filter .14s}
.st:active{transform:scale(.96)}
.st:disabled{opacity:.4;cursor:default;transform:none}

/* glass material */
.glass,.card,.mtile,.roundbtn,.tabs>div,.msg.a,.ask textarea{background:var(--glass);border:1px solid var(--glass-brd);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);box-shadow:0 1px 1px var(--shadow),0 10px 28px -16px var(--shadow)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card,.mtile,.roundbtn,.tabs>div,.msg.a,.ask textarea{background:var(--card)}}

.app{max-width:640px;margin-inline:auto;padding-inline:16px;padding-block:8px 124px}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 14px}
.roundbtn{width:44px;height:44px;border-radius:50%;color:var(--ink);display:grid;place-items:center}
#view{display:flex;flex-direction:column;gap:14px;min-width:0}

.card{border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.flat{background:var(--glass2);box-shadow:none}
.card.soft-g{background:color-mix(in srgb,var(--green-soft) 72%,transparent)}
.card.soft-s{background:color-mix(in srgb,var(--sky-soft) 72%,transparent)}
.card.soft-y{background:color-mix(in srgb,var(--sun-soft) 72%,transparent)}
.card.soft-c{background:color-mix(in srgb,var(--coral-soft) 72%,transparent)}
.hero{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--hero1),var(--hero2) 55%,var(--hero3));color:var(--on-hero);border-radius:30px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;border:1px solid rgb(255 255 255 / .22);box-shadow:0 16px 36px -18px var(--hero2)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 60% at 12% 0%,rgb(255 255 255 / .26),transparent 60%),radial-gradient(60% 50% at 100% 100%,rgb(255 255 255 / .1),transparent 70%)}
.hero>*{position:relative}
.hero .v{color:var(--on-hero2)}
.hero-top{display:flex;align-items:center;gap:14px}
.hero-top>div{min-width:0;flex:1}
.hd{display:flex;align-items:center;gap:12px;justify-content:space-between}
.hd>div{min-width:0}
.hd.grp{margin-top:6px;padding-inline:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;border-radius:999px;padding:4px 12px;border:0;font:700 13.5px/1.2 var(--f);white-space:nowrap;background:var(--glass);color:var(--ink);flex-shrink:0}
.card .chip,.sheet .chip{background:color-mix(in srgb,var(--card2) 80%,transparent)}
.hero .chip{background:rgb(255 255 255 / .18);color:var(--on-hero);border:1px solid rgb(255 255 255 / .22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.chip.g{background:var(--green-soft);color:var(--green-ink)}
.chip.c{background:var(--coral-soft);color:var(--coral-ink)}
.chip.y{background:var(--sun-soft);color:var(--sun-ink)}
.chip.s{background:var(--sky-soft);color:var(--sky-ink)}
.chip.on{background:var(--ink);color:var(--bg)}
.prog{height:10px;border-radius:99px;background:color-mix(in srgb,var(--ink) 9%,transparent);overflow:hidden;position:relative}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green2));border-radius:99px}
.prog.over i{background:var(--coral)}
.prog s{position:absolute;top:0;bottom:0;width:2px;background:var(--glass-hi)}
.hero .prog{background:rgb(255 255 255 / .22)}.hero .prog i{background:var(--on-hero)}
.prog.thin{height:6px}
.ring{position:relative;width:104px;height:104px;flex-shrink:0;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:color-mix(in srgb,var(--ink) 9%,transparent)}.ring .pg{stroke:var(--green);transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring.risk .pg{stroke:var(--coral)}

.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:999px;padding:10px 22px;border:0;font:800 15.5px/1.2 var(--f);text-align:center;background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
.btn.pri{background:linear-gradient(160deg,var(--green),var(--green2));color:var(--on-green);box-shadow:inset 0 1px 0 rgb(255 255 255 / .35),0 8px 18px -8px var(--green)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--green-ink);padding-inline:10px}
.btn.danger{background:transparent;color:var(--coral-ink);padding-inline:10px}
.btn.sm{min-height:38px;padding:6px 16px;font-size:14px}
.btn.grow{flex:1 1 150px}
.hero .btn.ghost{color:var(--on-hero)}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:14px;align-items:center;padding:11px 0;min-height:56px}
.li+.li{border-top:1px solid color-mix(in srgb,var(--ink) 9%,transparent)}
button.li{background:none;border:0;text-align:left;width:100%}
.lead{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink);flex-shrink:0}
.lead.g{background:var(--green-soft);color:var(--green-ink)}.lead.c{background:var(--coral-soft);color:var(--coral-ink)}
.lead.y{background:var(--sun-soft);color:var(--sun-ink)}.lead.s{background:var(--sky-soft);color:var(--sky-ink)}
.lead.done{background:linear-gradient(160deg,var(--green),var(--green2));color:var(--on-green)}
.li-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.li-e{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0;text-align:right}
.li.col{flex-direction:column;align-items:stretch;gap:10px}
.li.done .li-t>:first-child{text-decoration:line-through;text-decoration-thickness:1.5px}
.cat{display:flex;flex-direction:column;gap:6px;padding:12px 0;background:none;border:0;text-align:left;width:100%}
.cat+.cat{border-top:1px solid color-mix(in srgb,var(--ink) 9%,transparent)}

.chart{width:100%;height:auto;display:block}
.chart text{font:600 9px var(--f);fill:var(--ink2)}
.chart .grid{stroke:color-mix(in srgb,var(--ink) 12%,transparent);stroke-width:1}
.chart .barfill{fill:var(--green)}
.chart .tgt{stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover,.chart .hit:focus{fill:var(--ink);opacity:.07;outline:none}
.readout{min-height:20px}

.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
.cell{aspect-ratio:1;display:grid;place-items:center;border:0;border-radius:14px;background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink);font:800 14px/1 var(--f);padding:0;position:relative}
.cell.on{background:linear-gradient(160deg,var(--green),var(--green2));color:var(--on-green);border-radius:50%}
.cell.on::after{content:"✓";position:absolute;right:6px;bottom:4px;font-size:9px}
.cell.miss{background:transparent;border:1.5px dashed color-mix(in srgb,var(--ink) 25%,transparent);color:var(--ink2)}
.cell.fut{background:transparent;border:1.5px solid color-mix(in srgb,var(--ink) 14%,transparent);color:var(--ink2)}
.cell.now{background:transparent;border:2.5px solid var(--green);color:var(--green-ink)}

.medals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.medals>.mtile:last-child:nth-child(odd){grid-column:1/-1}
.mtile{border-radius:24px;padding:14px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0;color:var(--ink)}
.mtile .prog{width:100%;margin-top:2px}
.mg{display:block;flex-shrink:0}
.mg.pop{animation:pop .65s cubic-bezier(.2,0,0,1.5) both}
.mg.big{filter:drop-shadow(0 12px 16px var(--shadow))}
.spot{background:linear-gradient(160deg,color-mix(in srgb,var(--sun-soft) 85%,transparent),var(--glass) 75%)}
.spot-b{display:flex;gap:14px;align-items:center;background:none;border:0;padding:0;text-align:left;width:100%;color:var(--ink)}
.shelf{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.shelf-i{flex:0 0 auto;width:104px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:none;border:0;padding:0;color:var(--ink)}
.mhero{display:flex;flex-direction:column;align-items:center;gap:10px}
.lpath{display:flex;align-items:center}
.ln{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 12px/1 var(--f);background:rgb(255 255 255 / .18);color:var(--on-hero);flex-shrink:0}
.ln.d{background:var(--on-hero);color:var(--hero2)}
.ln.c{background:var(--m1);color:var(--m-ink);box-shadow:0 0 0 4px rgb(255 255 255 / .25)}
.lpath i{flex:1;height:3px;min-width:3px;background:rgb(255 255 255 / .25)}
.ln.d+i{background:var(--on-hero)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:800 12px/1 var(--f);background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink2)}
.dot.hit{background:var(--green);color:var(--on-green)}
.dot.jolly{background:var(--sun-soft);color:var(--sun-ink)}
.dot.open{border:2px solid var(--green);background:transparent;color:var(--green-ink)}

.tf{display:flex;flex-direction:column;gap:6px;min-width:0}
.tf label{font:700 13.5px/1.2 var(--f);color:var(--ink2);padding-inline:4px}
.tf input:not(.sr),.tf select,.tf textarea{min-height:52px;border:2px solid transparent;border-radius:16px;background:color-mix(in srgb,var(--ink) 7%,transparent);padding:10px 14px;width:100%;min-width:0;font:600 16px/1.3 var(--f)}
.tf input:focus,.tf select:focus,.tf textarea:focus{outline:none;border-color:var(--green);background:var(--glass-hi)}
.tf select option{background:var(--card);color:var(--ink)}
.tf .help{font:500 13px/1.35 var(--f);color:var(--ink2);padding-inline:4px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.segm{display:flex;background:color-mix(in srgb,var(--ink) 8%,transparent);border-radius:14px;padding:3px;gap:3px}
.segm label,.segm button{flex:1;min-width:0;display:flex;border:0;background:none;padding:0;cursor:pointer;color:inherit}
.segm span{flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;padding:6px 10px;border-radius:11px;font:700 14px/1.2 var(--f);text-align:center;color:var(--ink2)}
.segm input:checked+span,.segm button[aria-pressed="true"] span{background:var(--glass-hi);color:var(--ink);box-shadow:0 1px 4px var(--shadow)}
.segm input:focus-visible+span{outline:3px solid var(--sky)}
input[type=file]:focus-visible+label{outline:3px solid var(--sky);outline-offset:2px}
.switch{display:flex;align-items:center;gap:16px;justify-content:space-between;cursor:pointer}
.switch .track{width:52px;height:32px;border-radius:16px;background:color-mix(in srgb,var(--ink) 18%,transparent);position:relative;flex-shrink:0;transition:background .18s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--stk);box-shadow:0 1px 3px var(--shadow);transition:left .18s cubic-bezier(.2,.8,.2,1)}
.switch input:checked+.track{background:var(--green)}
.switch input:checked+.track::after{left:23px}
.switch input:focus-visible+.track{outline:3px solid var(--sky);outline-offset:2px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.errtxt{color:var(--coral-ink);font:700 14px/1.35 var(--f)}
.divider{border:0;border-top:1px solid color-mix(in srgb,var(--ink) 10%,transparent);margin:0;width:100%}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.tabs>div{pointer-events:auto;display:flex;width:100%;max-width:560px;border-radius:28px;padding:6px;box-shadow:0 12px 30px -10px var(--shadow)}
.tab{flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:22px;color:var(--ink2);font:700 11.5px/1.2 var(--f);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .2s,color .2s}
.tab[aria-current="page"]{color:var(--green-ink);background:var(--glass-hi);box-shadow:0 1px 4px var(--shadow)}

dialog{border:0;padding:0;color:var(--ink)}
dialog::backdrop{background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheetdlg{background:var(--glass-hi);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);border-top:1px solid var(--glass-brd);width:100%;max-width:640px;margin:auto auto 0;border-radius:32px 32px 0 0;max-height:92%;overflow:auto}
@media (min-width:700px){.sheetdlg{margin:auto;border-radius:32px;max-width:560px}}
.sheet{display:flex;flex-direction:column;gap:16px;padding:0 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet::before{content:"";align-self:center;width:38px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--ink) 22%,transparent);margin-top:10px}
.sheet .card{background:color-mix(in srgb,var(--ink) 5%,transparent);border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.sheet .roundbtn{-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;background:color-mix(in srgb,var(--ink) 8%,transparent);border-color:transparent}
.sh-foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.sh-foot .btn.pri{flex:1 1 180px}
.popup{background:transparent;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:20px;overflow:hidden}
.popup[open]{display:grid;place-items:center}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cele{position:relative;background:var(--glass-hi);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);border:1px solid var(--glass-brd);border-radius:32px;width:100%;max-width:360px;max-height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 22px 22px;text-align:center;box-shadow:0 24px 60px -24px var(--shadow)}
.cele .set{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cele .btn{align-self:stretch}
@keyframes pop{0%{transform:scale(.3) rotate(-22deg);opacity:0}100%{transform:none;opacity:1}}
.masc{flex-shrink:0;display:block}
.masc .bob{animation:bob 3.2s ease-in-out infinite;transform-origin:60px 100px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
#view>*{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.mg.pop,.masc .bob,#view>*{animation:none}*{transition:none!important}}

.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:11px 15px;border-radius:22px;white-space:pre-wrap;overflow-wrap:anywhere;font:500 15.5px/1.45 var(--f)}
.msg.u{align-self:flex-end;background:linear-gradient(160deg,var(--green),var(--green2));color:var(--on-green);border-bottom-right-radius:7px}
.msg.a{align-self:flex-start;border-bottom-left-radius:7px}
.msg.wait{color:var(--ink2)}
.ask{display:flex;gap:8px;align-items:flex-end}
.ask textarea{flex:1;min-width:0;min-height:50px;max-height:140px;resize:none;border-radius:24px;padding:12px 16px;font:600 16px/1.35 var(--f)}
.ask textarea:focus{outline:none;border-color:var(--green)}
.ask .roundbtn{width:50px;height:50px;background:linear-gradient(160deg,var(--green),var(--green2));color:var(--on-green);border-color:transparent}
.ask .roundbtn.stop{background:var(--ink);color:var(--bg)}

#toast{position:fixed;left:16px;right:16px;margin-inline:auto;max-width:420px;bottom:calc(104px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--ink) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--bg);padding:13px 18px;border-radius:20px;font:700 14.5px/1.35 var(--f);z-index:20;box-shadow:0 10px 28px -8px var(--shadow);pointer-events:none;text-align:center}

  coachRules:['You are the coach of Gruzzolo, a personal savings app. You are talking to the owner of the data below.\nRules:\n1. Reply in English, in an analytical, concrete way, without moralising. No stock encouragement.\n2. Use only the numbers present in the DATA or returned by the tool. Do not estimate missing figures: say that the data is not there.\n3. Short answers: 120 words at most, unless asked for detail. Plain text with line breaks only, no Markdown, asterisks or bullet symbols.\n4. When you suggest an action, tie it to a feature of the app: a cap on a category, the list of subscriptions to cut, the periodic commitment, a goal, a locked Space. Two actions per answer at most.\n5. Separate what the data shows from what you assume. A single month is not a trend.\n6. Do not give investment advice and do not judge the person. If distress or loss of control over some spending emerges, answer with respect and suggest talking to a professional.\n7. When relevant, remind the user that you only see the imported accounts and months.\n\nDATA (JSON, amounts in euros):\n','Sei il coach di Gruzzolo, un\'app personale di risparmio. Parli con il titolare dei dati qui sotto.\nRegole:\n1. Rispondi in italiano, in modo analitico, concreto e senza moralismi. Niente incoraggiamenti di maniera.\n2. Usa solo i numeri presenti nei DATI o restituiti dallo strumento. Non stimare cifre mancanti: di\' che il dato non c\'è.\n3. Risposte brevi: al massimo 120 parole, salvo richiesta di dettaglio. Solo testo semplice con a capo, senza Markdown, asterischi o elenchi puntati con simboli.\n4. Quando proponi un\'azione, collegala a una funzione dell\'app: tetto su una categoria, lista degli abbonamenti da tagliare, impegno periodico, obiettivo, Spazio bloccato. Al massimo due azioni per risposta.\n5. Distingui ciò che i dati mostrano da ciò che ipotizzi. Un solo mese non è una tendenza.\n6. Non dare consigli di investimento e non giudicare la persona. Se emerge disagio o perdita di controllo su una spesa, rispondi con rispetto e suggerisci di parlarne con un professionista.\n7. Ricorda quando serve che vedi solo i conti e i mesi importati.\n\nDATI (JSON, importi in euro):\n'],

  toolD:['Returns the individual imported expenses, filtered by month (YYYY-MM), category and merchant (partial match, case-insensitive). It returns at most 60 rows {date, euros, name, category, account}; positive euros = expense, negative = refund. Use it only if the totals in the DATA are not enough.','Restituisce le singole spese importate, filtrate per mese (YYYY-MM), categoria ed esercente (ricerca parziale, senza distinzione tra maiuscole e minuscole). Ritorna al massimo 60 righe {data, euro, nome, categoria, conto}; euro positivo = spesa, negativo = rimborso. Usalo solo se i totali nei DATI non bastano.'],

function cache(){try{localStorage.setItem(LS,lastJson)}catch(e){}}
function txCache(){try{localStorage.setItem(LST,JSON.stringify(TX))}catch(e){}}
function loadCache(){try{const j=localStorage.getItem(LS);if(j){S=normalize(JSON.parse(j));lastJson=JSON.stringify(S)}}catch(e){}
  try{const t=JSON.parse(localStorage.getItem(LST)||'null');if(t&&typeof t==='object')TX=t}catch(e){}
  try{const c=JSON.parse(localStorage.getItem(LSC)||'null');if(Array.isArray(c))chat.turns=c}catch(e){}}
function hasData(st){return st.goals.length>0||st.ev.length>0||st.demo}
const curT=()=>S.demo?demoTx():TX;
function commit(){lastJson=JSON.stringify(S);cache();render();if(store.mode==='db'){dirty=true;clearTimeout(tm);tm=setTimeout(flush,350)}}
async function flush(retry){
  if(writing||!dirty||!ref)return;writing=true;dirty=false;const body=JSON.parse(lastJson);
  try{await ref.set(body);store.err=null}
  catch(e){const code=e&&e.code;
    if((code==='unavailable'||!code)&&!retry){writing=false;dirty=true;setTimeout(()=>flush(true),900+Math.random()*900);return}
    store.err=code||'unavailable';if(code==='invalid_argument'||code==='revoked'||code==='not_granted'||code==='capability_disabled')store.mode='local'}
  writing=false;if(dirty&&store.mode==='db')flush()}
function onSnap(snap){
  const meta=snap.metadata||{};if(meta.hasPendingWrites||writing||dirty)return;
  if(snap.exists){const d=snap.data();if(d&&d.v){const j=JSON.stringify(normalize(JSON.parse(JSON.stringify(d))));if(j!==lastJson){S=JSON.parse(j);lastJson=j;cache();render()}}store.ready=true}
  else{if(meta.fromCache)return;store.ready=true;if(hasData(S)){dirty=true;flush()}}}
function onTxSnap(snap){
  const meta=snap.metadata||{};if(meta.fromCache&&snap.empty)return;
  const next={};snap.docs.forEach(d=>{const x=d.data();if(x&&Array.isArray(x.rows))next[d.id]=JSON.parse(JSON.stringify(x))});
  if(!txSeen&&!meta.fromCache){txSeen=true;for(const id in TX)if(!next[id]){next[id]=TX[id];txWrite(id,TX[id])}}
  TX=next;txCache();render()}
function txWrite(id,body){if(store.mode==='db'&&ref)ref.collection('tx').doc(id).set(body).catch(e=>{store.err=(e&&e.code)||'unavailable'})}
function txSave(id,body){TX[id]=body;txCache();txWrite(id,body)}
function txDel(id){delete TX[id];txCache();if(store.mode==='db'&&ref)ref.collection('tx').doc(id).delete().catch(()=>{})}
function useLocal(){store.mode='local';store.ready=true}
async function boot(){

  else{try{const t=localStorage.getItem('gruzzolo.tab');if(t&&TITLES[t])ui.tab=t}catch(e){}}
  applyLang();loadCache();render();
  let db=null,user=null,id=null;
  try{if(window.claude&&window.claude.use){
    window.claude.use('sample').then(f=>{SAMPLE=f||null;if(SAMPLE&&SAMPLE.limits)SAMPLE.limits().then(l=>{chat.tools=!!(l&&l.tools)}).catch(()=>{});if(ui.tab==='coach')render()}).catch(()=>{});
    const r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);db=r[0];user=r[1]}}catch(e){}
  try{id=user?await user.id():null}catch(e){}
  if(db&&id){try{ref=db.doc('data/users/'+id+'/gruzzolo');store.mode='db';ref.onSnapshot(onSnap,()=>{useLocal();store.err='unavailable'});
    ref.collection('tx').onSnapshot(onTxSnap,()=>{});setTimeout(()=>{store.ready=true},8000)}catch(e){useLocal()}}
  else useLocal()}

/* mode: undefined = toast with points, 'quiet' = no toast, 'silent' = no reward feedback at all */
function mutate(fn,mode){
  const t=TODAY(),T=curT(),b=score(S,t,T),bm=medals(S,b);fn(S);
  for(const g of S.goals)if(!g.done&&g.t>0&&goalSaved(S,g.id)>=g.t)g.done=t;
  const a=score(S,t,T),am=medals(S,a),up=am.filter((m,i)=>bm[i]&&m.tier>bm[i].tier),lvl=a.lv>b.lv?a:null;
  if(up.length){S.won=S.won||{};for(const m of up){const from=bm[am.indexOf(m)].tier,w=S.won[m.id]||(S.won[m.id]=[null,null,null]);for(let k=from;k<m.tier;k++)w[k]=t}if(S.pin&&!am.some(m=>m.id===S.pin&&m.next))S.pin=null}
  commit();if(mode==='silent')return;
  if(up.length||lvl)setTimeout(()=>celebrate(up,lvl,a.xp-b.xp),320);
  else if(!mode&&a.xp>b.xp)toast(tr('plusPts',a.xp-b.xp))}

function targets(sc,M){
  const P=sc.P,cur=P.cur,u=U(),t=TODAY(),out=[];
  if(cur.status!=='hit')out.push({ic:'bolt',h:u.aim,s:tr('toGoPts',eur(Math.max(0,cur.t-cur.s)),100+10*Math.min(P.streak+1,10)),f:cur.t?cur.s/cur.t:0,pin:1});
  if(sc.nextAt)out.push({ic:'medal',h:tr('levelNext',sc.nextName),s:tr('ptsToGo',sc.nextAt-sc.xp),f:(sc.xp-sc.base)/(sc.nextAt-sc.base)});
  for(const m of M)if(m.next)out.push({ic:m.ic,m,h:tr('medalTier',m.n,m.tier+1),s:tr('toGo',mleft(m)),f:m.val/m.next+(S.pin===m.id?1:0)});
  for(const g of S.goals){const p=goalPlan(S,g,t);if(p.left<=0)continue;const nx=[25,50,75,100].find(x=>p.frac*100<x);if(!nx)continue;
    out.push({ic:'flag',h:tr('goalStep',dmn(g.name),nx),s:tr('toGoPts',eur(Math.ceil(g.t*nx/100-p.saved)),MSXP[nx]),f:p.frac*100/nx})}

function chart(P){
  const L=P.list.slice(-12),r=S.set.r,W=336,H=136,x0=34,top=8,ph=84,slot=(W-x0-4)/12,bw=13;
  const mx=niceMax(Math.max.apply(null,L.map(p=>Math.max(p.s,p.t)))/100),y=v=>top+ph-(v/100/mx)*ph;
  let g='';[0,mx/2,mx].forEach(v=>{const yy=top+ph-(v/mx)*ph;g+=`<line class="grid" x1="${x0}" x2="${W-2}" y1="${yy}" y2="${yy}"/><text x="${x0-6}" y="${yy+3}" text-anchor="end">${v}</text>`});
  const off=P.list.length-L.length;
  L.forEach((p,i)=>{const x=x0+i*slot+(slot-bw)/2,yb=top+ph,yt=y(Math.max(0,p.s)),hh=yb-yt,rr=Math.min(5,hh);
    if(hh>0)g+=`<path class="barfill" d="M${x} ${yb}V${yt+rr}Q${x} ${yt} ${x+rr} ${yt}H${x+bw-rr}Q${x+bw} ${yt} ${x+bw} ${yt+rr}V${yb}Z"/>`;
    g+=`<line class="tgt" x1="${x-3}" x2="${x+bw+3}" y1="${y(p.t)}" y2="${y(p.t)}"/>`;
    g+=`<text x="${x+bw/2}" y="${top+ph+13}" text-anchor="middle">${{hit:'✓',jolly:'J',miss:'–',open:'•'}[p.status]}</text>`;
    const d=pd(p.k),lab=r==='m'?dfM.format(d).slice(0,3):d.getDate();
    g+=`<text x="${x+bw/2}" y="${top+ph+26}" text-anchor="middle">${lab}</text>`;
    if(r==='w'&&(i===0||d.getDate()<=7))g+=`<text x="${x+bw/2}" y="${top+ph+38}" text-anchor="middle">${dfM.format(d).slice(0,3)}</text>`;
    g+=`<rect class="hit" data-bar="${off+i}" tabindex="0" role="img" aria-label="${tr('barAria',esc(pLabel(p.k,r)),p.s/100,p.t/100)}" x="${x0+i*slot}" y="${top}" width="${slot}" height="${ph}"/>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="group" aria-label="${tr('chartAria')}">${g}</svg>`}

function loadPdf(){return pdfReady||(pdfReady=loadScript(PDFJS+PDFN[0]).then(()=>loadScript(PDFJS+PDFN[1])).then(()=>{if(!window.pdfjsLib)throw new Error('lib')}).catch(e=>{pdfReady=null;throw e}))}

  for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i),tc=await pg.getTextContent();pages.push({items:tc.items.filter(t=>t.str&&t.str.trim()).map(t=>({s:t.str,x:t.transform[4],y:t.transform[5]}))})}
  return pages}

document.addEventListener('submit',e=>{
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
  if(e.target.id==='askf'){ask(f.q);return}
  if(e.target.id==='sheetForm'){const err=sheetSubmit?sheetSubmit(f):null,el=$('sheetErr');if(err){if(el){el.textContent=err;el.hidden=false}}else closeSheet();return}
  if(e.target.id==='ob'){const el=$('ob-err'),fail=m=>{el.textContent=m;el.hidden=false};
    if(!store.ready)return fail(tr('loading'));
    const name=(f.name||'').trim(),t=money(f.t),im=money(f.imp);
    if(!name)return fail(tr('errGoalName'));if(!t)return fail(tr('errGoalAmt'));
    if(f.by&&(!isYmd(f.by)||f.by<=TODAY()))return fail(tr('errByFuture'));
    if(!im)return fail(tr('errCommitOb'));
    S=blank();S.set.r=f.r==='m'?'m':'w';S.set.imp=im;S.goals.push({id:uid(),name,t,by:f.by||null,c:TODAY()});ui.tab='oggi';commit();window.scrollTo(0,0);return}
  if(e.target.id==='subf'){if(!store.ready)return;const n=(f.n||'').trim(),a=money(f.a);if(!n||!a){toast(tr('errSub'));return}
    mutate(s=>{s.ch.subs.push({id:uid(),n,a,cut:false})},'silent')}});
